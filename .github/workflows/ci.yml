name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Typecheck, tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (Electron binary skipped — not needed for checks)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Full boot smoke with the real Electron binary under a virtual display:
  # starts the app, waits for the window to paint, captures a screenshot,
  # fails on any renderer error.
  smoke:
    name: Boot smoke (Electron + Xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a npx electron scripts/smoke.cjs --no-sandbox --disable-gpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: smoke.png
          if-no-files-found: ignore

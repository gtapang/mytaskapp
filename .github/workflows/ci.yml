name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The core package is pure Swift and builds anywhere — this is the fast,
  # always-available check (same thing that runs in Linux dev environments).
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Run HermesNotesCore tests
        working-directory: HermesNotesCore
        run: swift test

  # Full app build needs Xcode with the iOS 26 SDK (Foundation Models).
  # If the pinned runner image lags behind, bump `runs-on` / the Xcode
  # version selection below rather than skipping the job.
  app-ios:
    name: App build (iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project HermesNotes.xcodeproj \
            -scheme HermesNotes \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

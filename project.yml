# XcodeGen project definition. Generate the Xcode project on a Mac with:
#   brew install xcodegen && xcodegen generate && open HermesNotes.xcodeproj
# Requires Xcode 26+ (Foundation Models SDK).
name: HermesNotes

options:
  bundleIdPrefix: dev.giovanni
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  HermesNotesCore:
    path: HermesNotesCore

targets:
  HermesNotes:
    type: application
    platform: iOS
    sources:
      - HermesNotesApp
    dependencies:
      - package: HermesNotesCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        INFOPLIST_KEY_CFBundleDisplayName: Hermes Notes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: >-
          Hermes Notes shows your calendar on the Today and Calendar screens.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: YES
